name: Dev Test Build

on:
  workflow_dispatch:
    inputs:
      build_chat_id:
        description: 'Telegram chat ID for progress updates'
        required: true
        default: ''
      build_message_id:
        description: 'Telegram message ID to edit for live progress'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  dev-test-build:
    name: Dev Test Build (no client delivery)
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID:    ${{ github.event.inputs.build_chat_id }}
      MSG_ID:     ${{ github.event.inputs.build_message_id }}

    steps:
      # ── 1. Checkout dev branch ──────────────────────────────────────────────
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      # ── 2. Notify start ─────────────────────────────────────────────────────
      - name: Notify — Dev build started
        run: |
          python3 scripts/telegram_notify.py \
            --step    "Dev Test Build" \
            --status  "progress" \
            --build   "${{ github.run_number }}" \
            --template "dev-test" \
            --client  "0" \
            --chat-id  "$CHAT_ID" \
            --msg-id   "$MSG_ID" \
            --token    "$BOT_TOKEN" || true

      # ── 3. Install tools ────────────────────────────────────────────────────
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zipalign apksigner aapt python3-pil libsmali-java
          pip3 install cryptography --break-system-packages 2>/dev/null || true

          APKTOOL_VER="2.9.3"
          if ! curl -fsSL --max-time 90 --retry 2 --retry-delay 5 \
               "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" \
               -o /usr/local/bin/apktool.jar; then
            curl -fsSL --max-time 90 --retry 2 \
               "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_${APKTOOL_VER}.jar" \
               -o /usr/local/bin/apktool.jar || { echo "::error::apktool download failed"; exit 1; }
          fi
          curl -fsSL --max-time 30 --retry 2 \
               "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" \
               -o /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool

          mkdir -p "$GITHUB_WORKSPACE/tools"
          if [ -f /usr/share/java/smali.jar ]; then
            cp /usr/share/java/smali.jar "$GITHUB_WORKSPACE/tools/smali.jar"
          else
            echo "::error::smali.jar not found"
            exit 1
          fi

      # ── 4. Set up JDK ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Build APK (dev validation) ───────────────────────────────────────
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -50
        env:
          KEYSTORE_BASE64:    ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD:  ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          TEMPLATE:           "wedding"
          CLIENT_ID:          "0"
          SERVER_HOST_B64:    ""
          SERVER_PORT_B64:    ""
          SERVER_KEY_B64:     ""

      # ── 6. Notify result ────────────────────────────────────────────────────
      - name: Notify — Dev build result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="success"
            MSG="✅ Dev build passed — safe to deploy to production"
          else
            STATUS="failed"
            MSG="❌ Dev build failed — fix before deploying to production"
          fi
          python3 scripts/telegram_notify.py \
            --step    "Dev Test Build" \
            --status  "$STATUS" \
            --build   "${{ github.run_number }}" \
            --template "dev-test" \
            --client  "0" \
            --chat-id  "$CHAT_ID" \
            --msg-id   "$MSG_ID" \
            --token    "$BOT_TOKEN" \
            --extra-msg "$MSG" || true
