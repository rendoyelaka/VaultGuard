name: Protect Main Branch

on:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 */6 * * *'   # re-enforce every 6 hours automatically
  workflow_dispatch:          # allow manual trigger anytime

jobs:
  protect-main:
    name: Enforce main branch protection
    runs-on: ubuntu-latest
    steps:
      - name: Apply branch protection to main
        run: |
          TOKEN="${{ secrets.BRANCH_PROTECTION_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            echo "❌ BRANCH_PROTECTION_TOKEN secret not set. Skipping."
            exit 1
          fi

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main/protection" \
            -d '{
              "required_status_checks": null,
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "required_approving_review_count": 1,
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": false
              },
              "restrictions": null,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "block_creations": false
            }')

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ main branch protection enforced successfully."
          else
            echo "❌ Failed to set branch protection. HTTP status: $RESPONSE"
            exit 1
          fi

      - name: Verify protection is active
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.BRANCH_PROTECTION_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/branches/main/protection" \
            | python3 -c "
import sys, json
data = json.load(sys.stdin)
pr = data.get('required_pull_request_reviews', {})
print('PR reviews required:', pr.get('required_approving_review_count'))
print('Enforce admins:', data.get('enforce_admins', {}).get('enabled'))
print('Force push blocked:', not data.get('allow_force_pushes', {}).get('enabled', True))
print('✅ Protection verified.')
"
